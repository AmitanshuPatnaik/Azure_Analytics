<div class="home-container">

  <app-sidebar></app-sidebar>

  <div class="dashboard-content">
    @switch (dashboardService.selectedPage) {
      @case ('home') {
        <app-dashboard-home></app-dashboard-home>
      }
      @case ('projects') {
        <app-projects></app-projects>
      }
      @case ('project-detail') {
        <app-project-detail></app-project-detail>
      }
      @case ('repos') {
        <app-repos></app-repos>
      }
      @case ('pipelines') {
        <app-pipelines></app-pipelines>
      }
      @case ('boards') {
        <app-boards></app-boards>
      }
      @case ('testplans') {
        <app-testplans></app-testplans>
      }
      @case ('azure') {
        <app-azure></app-azure>
      }
    }
  </div>

</div>
